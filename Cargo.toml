[package]
name = "snapjudge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Find LLM call sites that are closed-set decisions and measure whether TypeSafe Jev can take them over"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xendale/snapjudge"
homepage = "https://github.com/0xendale/snapjudge"
readme = "README.md"
include = [
  "Cargo.toml", "Cargo.lock", "README.md", "COMPATIBILITY.md",
  "LICENSE-MIT", "LICENSE-APACHE", "rust-toolchain.toml", "dist-workspace.toml",
  "src/**", "tests/**", "schemas/**", "fixtures/**", "adapters/**",
  "!adapters/opencode/node_modules/**", "!adapters/opencode/dist/**",
  "!adapters/opencode/coverage/**",
  "scripts/public-snapshot.sh",
]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
ast-grep-core = "=0.45.3"
ast-grep-language = { version = "=0.45.3", default-features = false, features = ["tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "7.0.0"
ignore = "0.4.33"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
typed-arena = "2.0.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
jsonschema = { version = "0.58.1", default-features = false }
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"
